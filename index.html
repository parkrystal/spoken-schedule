<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5">
<title>말로 쓰는 일정</title>
<style>
.voice-controls{display:flex;align-items:center;gap:10px;margin-top:12px}.voice-icon-button{width:48px;height:48px;min-width:48px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}.voice-icon-button:focus-visible{outline:3px solid #8ab4f8;outline-offset:3px}.voice-icon-button:active{transform:scale(.95)}.voice-icon-button:disabled{cursor:default;opacity:1}.mic-icon,.stop-icon{width:22px;height:22px;display:block}.stop-icon{width:17px;height:17px;border-radius:3px;background:currentColor}.waveform{height:24px;display:flex;align-items:center;justify-content:center;gap:3px}.waveform span{display:block;width:3px;height:5px;border-radius:3px;background:currentColor;transform-origin:center;animation:wave 850ms ease-in-out infinite alternate}.waveform span:nth-child(2){animation-delay:120ms}.waveform span:nth-child(3){animation-delay:240ms}.waveform span:nth-child(4){animation-delay:360ms}.waveform span:nth-child(5){animation-delay:480ms}@keyframes wave{from{height:5px}to{height:21px}}@media(prefers-reduced-motion:reduce){.voice-icon-button{transition:none}.waveform span{animation:none;height:10px}.waveform span:nth-child(2),.waveform span:nth-child(4){height:17px}.waveform span:nth-child(3){height:21px}}
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#222;background:#f7f7f5}*{box-sizing:border-box}body{margin:0;padding:24px 16px 48px}.wrap{max-width:720px;margin:auto}h1{font-size:28px;margin:8px 0}.sub{color:#666;margin:0 0 24px;line-height:1.5}.panel{background:#fff;border:1px solid #e6e6e2;border-radius:18px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin-bottom:8px}textarea,input{width:100%;font:inherit;border:1px solid #d8d8d2;border-radius:10px;padding:12px;background:white;color:#222}textarea{min-height:104px;resize:vertical;line-height:1.5}button{font:inherit;font-weight:650;border:0;border-radius:11px;padding:12px 15px;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#efefeb;color:#222}.danger{background:#fff0ef;color:#a32620}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row button{flex:1}.small{font-size:13px;color:#666;line-height:1.5}.status{margin-top:10px;min-height:20px;font-size:14px;color:#555}h2{font-size:19px;margin:0 0 10px}.event{border:1px solid #e7e7e2;border-radius:13px;padding:13px;margin-top:10px}.eventtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eventtitle{font-weight:700;overflow-wrap:anywhere}.eventdate{font-size:13px;color:#666;margin-top:4px}.empty{padding:18px 8px;color:#777;text-align:center}@media(min-width:600px){body{padding-top:36px}.panel{padding:22px}}
</style></head><body><div class="wrap">
<h1>말로 쓰는 일정</h1><p class="sub">말한 내용을 일정으로 정리해 저장하는 첫 번째 시험 버전이에요.</p>
<section class="panel"><label for="speechText">1. 일정 말하기 또는 입력하기</label><textarea id="speechText" placeholder="예: 내일 오전 10시에 소아과 예약, 오후 3시에 장보기"></textarea><div class="voice-controls" role="group" aria-label="음성 입력 조작"><button id="startBtn" class="primary voice-icon-button" type="button" aria-label="음성 입력 시작" title="음성 입력 시작"><svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg></button><button id="stopBtn" class="secondary voice-icon-button" type="button" aria-label="음성 입력 중지" title="음성 입력 중지" disabled><span class="stop-icon" aria-hidden="true"></span></button></div><div id="speechStatus" class="status" role="status">음성 인식은 브라우저와 기기에 따라 지원 여부가 달라질 수 있어요.</div><p class="small">인식된 문장을 확인한 뒤 일정으로 추가하세요. 브라우저 음성 인식이 지원되지 않으면 직접 입력할 수 있습니다.</p><button id="parseBtn" class="primary" style="width:100%;margin-top:8px">2. 입력한 내용을 일정으로 추가</button></section>
<section class="panel"><h2>일정 목록</h2><p class="small">일정은 이 브라우저의 기기 안에 저장됩니다. 다른 기기와 자동 동기화되지는 않습니다.</p><div class="row"><button id="exportBtn" class="secondary">일정 내보내기</button><button id="clearBtn" class="danger">전체 삭제</button></div><div id="events"></div></section><p class="small">초기 시제품 · 날짜와 시간 자동 분리는 간단한 규칙 기반이므로 저장 전에 확인해 주세요.</p></div>
<script>
const textEl=document.getElementById('speechText'),statusEl=document.getElementById('speechStatus'),eventsEl=document.getElementById('events');let events=loadEvents(),recognition=null,isListening=false,pendingScheduleAdd=false;
function loadEvents(){try{return JSON.parse(localStorage.getItem('spokenScheduleEvents')||'[]')}catch(e){return []}}function persist(){localStorage.setItem('spokenScheduleEvents',JSON.stringify(events));render()}function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dateLabel(s){if(!s)return '날짜 미지정';const d=new Date(s+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function render(){eventsEl.innerHTML='';if(!events.length){eventsEl.innerHTML='<div class="empty">아직 등록된 일정이 없어요.</div>';return}events.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));events.forEach((ev,i)=>{const card=document.createElement('div');card.className='event';const top=document.createElement('div');top.className='eventtop';const info=document.createElement('div');const title=document.createElement('div');title.className='eventtitle';title.textContent=ev.title||'(내용 없음)';const date=document.createElement('div');date.className='eventdate';date.textContent=dateLabel(ev.date)+(ev.time?' · '+ev.time:' · 시간 미지정');info.append(title,date);top.append(info);const edit=document.createElement('button');edit.className='secondary';edit.textContent='수정';edit.onclick=()=>editEvent(i);top.append(edit);card.append(top);const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.style.marginTop='10px';del.onclick=()=>{events.splice(i,1);persist()};card.append(del);eventsEl.append(card)})}
function parseDate(text){const now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(/모레/.test(text))d.setDate(d.getDate()+2);else if(/내일/.test(text))d.setDate(d.getDate()+1);else if(/오늘/.test(text)){}else{const m=text.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){d=new Date(now.getFullYear(),Number(m[1])-1,Number(m[2]));if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1)}else{const days={'일요일':0,'월요일':1,'화요일':2,'수요일':3,'목요일':4,'금요일':5,'토요일':6,'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};const match=text.match(/(일요일|월요일|화요일|수요일|목요일|금요일|토요일|일|월|화|수|목|금|토)(?:요일)?/);if(match){let diff=(days[match[1]]-now.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff)}else return ''}}return dateISO(d)}
function parseTime(text){let m=text.match(/오전\s*(\d{1,2})(?:시\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1])%12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}m=text.match(/오후\s*(\d{1,2})(?:시\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1])%12+12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}m=text.match(/(\d{1,2}):(\d{2})/);if(m)return `${String(Number(m[1])).padStart(2,'0')}:${m[2]}`;m=text.match(/(\d{1,2})시(?:\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1]);if(/오후|저녁/.test(text)&&h<12)h+=12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}return ''}
function parseAndAdd(){if(isListening){pendingScheduleAdd=true;statusEl.textContent='음성 인식을 마친 뒤 일정을 추가할게요.';stopRecognition();return}const raw=textEl.value.trim();if(!raw){statusEl.textContent='먼저 음성으로 말하거나 일정을 입력해 주세요.';return}const segments=raw.split(/[,，;；\n]+|그리고\s+/).map(x=>x.trim()).filter(Boolean);const baseDate=parseDate(raw);segments.forEach(seg=>{const d=parseDate(seg)||baseDate,t=parseTime(seg);let title=seg.replace(/(오늘|내일|모레|일요일|월요일|화요일|수요일|목요일|금요일|토요일)/g,'').replace(/오전\s*\d{1,2}(?:시\s*\d{1,2}분?)?/g,'').replace(/오후\s*\d{1,2}(?:시\s*\d{1,2}분?)?/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/\d{1,2}시(?:\s*\d{1,2}분?)?/g,'').replace(/\d{1,2}월\s*\d{1,2}일/g,'').replace(/^\s*(에|은|는|그리고)\s*/,'').trim().replace(/\s+/g,' ');events.push({title:title||seg,date:d,time:t,id:Date.now()+Math.random()})});persist();textEl.value='';statusEl.textContent=`${segments.length}개 일정을 목록에 추가했어요. 날짜와 시간을 확인해 주세요.`}
function editEvent(i){const ev=events[i],title=prompt('일정 내용',ev.title);if(title===null)return;const date=prompt('날짜 (YYYY-MM-DD, 비우면 날짜 미지정)',ev.date||'');if(date===null)return;const time=prompt('시간 (HH:MM, 비우면 시간 미지정)',ev.time||'');if(time===null)return;ev.title=title.trim();ev.date=/^\d{4}-\d{2}-\d{2}$/.test(date.trim())?date.trim():'';ev.time=/^\d{1,2}:\d{2}$/.test(time.trim())?time.trim():'';persist()}
document.getElementById('parseBtn').onclick=parseAndAdd;const startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn');function setVoiceListening(listening){isListening=listening;if(listening){startBtn.innerHTML='<span class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>';startBtn.setAttribute('aria-label','음성 인식 중');startBtn.title='음성 인식 중';startBtn.setAttribute('aria-pressed','true');startBtn.disabled=true;stopBtn.disabled=false}else{startBtn.innerHTML='<svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg>';startBtn.setAttribute('aria-label','음성 입력 시작');startBtn.title='음성 입력 시작';startBtn.setAttribute('aria-pressed','false');startBtn.disabled=false;stopBtn.disabled=true}}startBtn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.textContent='이 브라우저에서는 음성 인식을 사용할 수 없어요. 다른 지원 브라우저에서 시도하거나 직접 입력해 주세요.';return}try{recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=true;let finalText='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=part+' ';else interim+=part}textEl.value=(finalText+interim).trim();statusEl.textContent='음성을 인식하고 있어요. 인식된 문장을 확인해 주세요.'};recognition.onerror=e=>{statusEl.textContent='음성 인식 오류: '+e.error+'. 브라우저 권한과 연결 상태를 확인해 주세요.';stopRecognition()};recognition.onend=()=>{setVoiceListening(false);if(pendingScheduleAdd){pendingScheduleAdd=false;parseAndAdd();return}if(!statusEl.textContent.includes('오류'))statusEl.textContent='음성 인식이 끝났어요. 문장을 확인한 뒤 일정을 추가해 주세요.'};recognition.start();setVoiceListening(true);statusEl.textContent='말씀해 주세요.'}catch(e){setVoiceListening(false);statusEl.textContent='음성 인식을 시작하지 못했어요. 브라우저 호환성이나 권한을 확인해 주세요.'}};function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}}setVoiceListening(false)}stopBtn.onclick=stopRecognition;document.getElementById('clearBtn').onclick=()=>{if(confirm('저장된 일정을 모두 삭제할까요?')){events=[];persist()}};document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-schedule.json';a.click();URL.revokeObjectURL(url)};render();
</script></body></html>
