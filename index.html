<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#202124;background:#f3f3f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:44px 18px 64px}.wrap{width:min(100%,600px);margin:0 auto}.app-header{margin:0 0 22px;text-align:center}.app-kicker{display:block;margin:0 0 9px;color:#89877f;font-size:11px;font-weight:500;letter-spacing:.08em;line-height:1.5}.eyebrow{display:block;color:#888;font-size:11px;font-weight:700;letter-spacing:.12em;margin-bottom:7px}h1{margin:0;font-family:"Noto Serif KR","Batang","바탕",serif;font-size:clamp(34px,9vw,44px);font-weight:500;letter-spacing:.095em;line-height:1.25}.app-subtitle{display:block;margin-top:7px;color:#85857e;font-family:"Noto Serif KR","Batang","바탕",serif;font-size:10px;font-weight:400;letter-spacing:.22em;line-height:1.5}h1 .title-period{font-size:.58em;margin-left:.015em;vertical-align:.04em}.composer{background:#fff;border:1px solid #e8e8e4;border-radius:18px;padding:16px}.composer label{display:block;font-size:13px;font-weight:650;margin:0 0 9px}.composer textarea{display:block;width:100%;min-height:100px;padding:12px 0;border:0;outline:0;resize:vertical;background:transparent;color:#222;font:inherit;line-height:1.55}.composer textarea::placeholder{color:#aaa}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.voice-controls{display:flex;align-items:center;gap:8px}.voice-icon-button{width:42px;height:42px;min-width:42px;padding:0;border:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s ease,background .15s ease}.voice-icon-button:focus-visible,.add-btn:focus-visible,.icon-action:focus-visible,.list-tools button:focus-visible{outline:3px solid #a6c8ff;outline-offset:3px}.voice-icon-button:active{transform:scale(.95)}.voice-icon-button:disabled{cursor:default;opacity:.42}.mic-icon,.stop-icon{width:20px;height:20px;display:block}.stop-icon{width:15px;height:15px;border-radius:3px;background:currentColor}.waveform{height:22px;display:flex;align-items:center;justify-content:center;gap:3px}.waveform span{display:block;width:3px;height:5px;border-radius:3px;background:currentColor;animation:wave 850ms ease-in-out infinite alternate}.waveform span:nth-child(2){animation-delay:120ms}.waveform span:nth-child(3){animation-delay:240ms}.waveform span:nth-child(4){animation-delay:360ms}.waveform span:nth-child(5){animation-delay:480ms}@keyframes wave{to{height:20px}}.start-voice{background:#f0f0ed;color:#222}.stop-voice{background:#222;color:white}.add-actions{display:flex;align-items:center;gap:10px;height:40px}.composer .important-toggle{display:inline-flex;margin:0;height:40px;min-width:82px;display:inline-flex;align-items:center;justify-content:center;align-self:center;gap:7px;padding:0 10px;border:1px solid #e5e5df;border-radius:12px;background:#f8f8f5;color:#74746d;line-height:1;white-space:nowrap;cursor:pointer;transition:background .15s,border-color .15s,color .15s}.important-toggle:hover{background:#f0f0eb}.important-toggle:has(input:checked){border-color:#ead295;background:#fff6dc;color:#b7831b}.important-toggle input{appearance:none;width:17px;height:17px;flex:0 0 17px;margin:0;display:grid;place-content:center;border:1.5px solid #bdbdb5;border-radius:5px;background:#fff;color:#fff;cursor:pointer;transition:background .14s,border-color .14s}.important-toggle input::before{content:"";width:7px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) scale(0);transition:transform .1s}.important-toggle input:checked{border-color:#bf8616;background:#bf8616}.important-toggle input:checked::before{transform:rotate(-45deg) scale(1)}.importance-label{font-size:13px;font-weight:600;line-height:1}.important-toggle input:checked~.importance-label{color:#76520a}.important-toggle input:focus-visible{outline:3px solid #f2d58f;outline-offset:2px}.add-btn{min-width:92px;height:40px;align-self:center;padding:0 16px;border:0;border-radius:12px;background:#222;color:#fff;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.status:empty{display:none}.status{min-height:18px;margin-top:8px;color:#777;font-size:12px;line-height:1.5}.list-section{margin-top:30px}.list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:0}h2{margin:0;font-size:17px;letter-spacing:-.02em}.list-tools{display:flex;gap:12px}.list-tools button{border:0;padding:4px 0;background:transparent;color:#777;font:inherit;font-size:12px;cursor:pointer}.list-tools #clearBtn{color:#b05650}.event{position:relative;display:block;overflow:hidden;margin:4px 0;padding:0;border:1px solid #e9e9e5;border-radius:10px;background:#f9f9f6;box-shadow:none;touch-action:pan-y;-webkit-user-select:none;user-select:none}.event-important{background:#fff7df;border-color:#f1d58e}.event-content{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:14px 10px;background:inherit;transform:translateX(0);transition:transform .18s ease}.event.show-delete .event-content{transform:translateX(-76px)}.event.show-edit .event-content{transform:translateX(76px)}.event-actions{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:space-between}.event-actions .icon-action{width:76px;height:auto;flex-direction:column;gap:3px;border-radius:0;background:#e8e8e4;color:#4c4d49}.event-actions .edit-action{background:#e8edf4;color:#3d5c82}.event-actions .delete-action{background:#f5e2df;color:#a24740}.action-label{font-size:11px;font-weight:650;line-height:1}.eventtop{display:flex;flex:1;justify-content:space-between;gap:12px;align-items:center}.eventtitle{font-size:14px;font-weight:600;overflow-wrap:anywhere;white-space:pre-line}.event-important .eventtitle{font-weight:750;color:#674600}.day-icon{display:inline-block;width:1.5em;margin-right:4px;text-align:center}.eventdate{margin-top:4px;color:#888;font-size:12px}.event-actions .icon-action{display:inline-flex;align-items:center;justify-content:center}.icon-action{width:34px;height:34px;padding:0;border:0;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#777;cursor:pointer}.icon-action:hover{background:#f1f1ee}.icon-action svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.delete-action{color:#b05650}.event-edit{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-width:0;max-width:100%;gap:13px;padding:14px;overflow:hidden;text-align:left}.event-edit label{display:grid;grid-template-columns:minmax(0,1fr);width:100%;min-width:0;max-width:100%;gap:7px;margin:0;color:#5f5f59;font-size:15px;font-weight:600;text-align:left}.event-edit input{display:block;width:100%;min-width:0;max-width:100%;min-inline-size:0;box-sizing:border-box;padding:10px;border:1px solid #deded8;border-radius:9px;background:white;color:#222;font:inherit;font-size:16px;text-align:left;text-align-last:left}.event-edit input[type=date],.event-edit input[type=time]{width:100%;min-width:0;max-width:100%;min-inline-size:0;direction:ltr;text-align:left;text-align-last:left}.event-edit input[type=date]::-webkit-date-and-time-value,.event-edit input[type=time]::-webkit-date-and-time-value{min-width:0;margin:0;text-align:left}.event-edit input[type=date]::-webkit-datetime-edit,.event-edit input[type=time]::-webkit-datetime-edit{text-align:left}.edit-actions{display:flex;gap:8px}.edit-actions button{flex:1;padding:10px 12px;border:0;border-radius:10px;font:inherit;font-weight:600;text-align:center;cursor:pointer}.primary{background:#222;color:#fff}.secondary{background:#f0f0ed;color:#222}.empty{padding:30px 4px;color:#999;text-align:center;font-size:13px}@media(max-width:480px){body{padding:30px 16px 48px}.composer{padding:14px}.app-header{margin-bottom:18px}.list-section{margin-top:25px}}@media(prefers-reduced-motion:reduce){.voice-icon-button{transition:none}.waveform span{animation:none;height:10px}.waveform span:nth-child(2),.waveform span:nth-child(4){height:16px}.waveform span:nth-child(3){height:20px}}</style></head><body><div class="wrap"><header class="app-header"><span class="app-kicker">음성으로 남겨보는 기적같은 일정 프로그램</span><h1>너의 일정은<span class="title-period">。</span></h1><span class="app-subtitle">your schedule</span></header>
<section class="composer" aria-label="일정 입력"><textarea id="speechText" aria-label="새 일정 입력" placeholder="예: 내일 오전 10시 병원 예약"></textarea><div class="composer-bottom"><div class="voice-controls" role="group" aria-label="음성 입력 조작"><button id="startBtn" class="voice-icon-button start-voice" type="button" aria-label="음성 입력 시작" title="음성 입력 시작"><svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg></button><button id="stopBtn" class="voice-icon-button stop-voice" type="button" aria-label="음성 입력 중지" title="음성 입력 중지" disabled><span class="stop-icon" aria-hidden="true"></span></button></div><div class="add-actions"><label class="important-toggle" title="중요 일정으로 표시"><input id="importantCheck" type="checkbox" aria-label="중요 일정으로 표시"><span class="importance-label">중요</span></label><button id="parseBtn" class="add-btn" type="button">일정 추가</button></div></div><div id="speechStatus" class="status" role="status"></div></section>
<section class="list-section" aria-label="일정 목록"><div class="list-heading"><h2>일정 목록</h2><div class="list-tools"><button id="exportBtn" type="button">내보내기</button><button id="clearBtn" type="button">전체 삭제</button></div></div><div id="events"></div></section></div>
<script>
const textEl=document.getElementById('speechText'),statusEl=document.getElementById('speechStatus'),eventsEl=document.getElementById('events');let events=loadEvents(),recognition=null,isListening=false,pendingScheduleAdd=false;let swipeState=null,editingEventId=null;document.addEventListener('pointerup',e=>{const state=swipeState;if(!state||state.pointerId!==e.pointerId)return;swipeState=null;const dx=e.clientX-state.startX,dy=e.clientY-state.startY;if(Math.abs(dx)>22&&Math.abs(dx)>Math.abs(dy)*1.1){if(state.openAction==='edit'){if(dx<0)state.card.classList.remove('show-edit')}else if(state.openAction==='delete'){if(dx>0)state.card.classList.remove('show-delete')}else{state.card.classList.remove('show-edit','show-delete');state.card.classList.add(dx<0?'show-delete':'show-edit')}}});document.addEventListener('pointercancel',e=>{if(swipeState&&swipeState.pointerId===e.pointerId)swipeState=null});
function loadEvents(){try{const saved=JSON.parse(localStorage.getItem('spokenScheduleEvents')||'[]');if(!Array.isArray(saved))return [];const fallbackDate=nextDayISO();let changed=false;const normalized=saved.map(ev=>{const item={...ev};if(!item.date){item.date=fallbackDate;changed=true}if(!item.time){item.time='09:00';changed=true}return item});if(changed)localStorage.setItem('spokenScheduleEvents',JSON.stringify(normalized));return normalized}catch(e){return []}}function persist(){localStorage.setItem('spokenScheduleEvents',JSON.stringify(events));render()}function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function nextDayISO(){const d=new Date();d.setDate(d.getDate()+1);return dateISO(d)}function dateLabel(s){if(!s)return '날짜 미지정';const d=new Date(s+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function render(){eventsEl.innerHTML='';if(!events.length){eventsEl.innerHTML='<div class="empty">아직 등록된 일정이 없어요.</div>';return}events.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));events.forEach((ev,i)=>{const card=document.createElement('div');card.className='event'+(ev.important?' event-important':'');const top=document.createElement('div');top.className='eventtop';const info=document.createElement('div');const title=document.createElement('div');title.className='eventtitle';const icon=document.createElement('span');icon.className='day-icon';icon.setAttribute('aria-hidden','true');const hour=Number((ev.time||'09:00').split(':')[0]);icon.textContent=(hour>=4&&hour<18)?'☀️':'🌙';title.append(icon,document.createTextNode(ev.title||'내용없음'));const date=document.createElement('div');date.className='eventdate';date.textContent=dateLabel(ev.date)+(ev.time?' · '+ev.time:' · 시간 미지정');info.append(title,date);top.append(info);const content=document.createElement('div');content.className='event-content';content.append(top);card.append(content);const actions=document.createElement('div');actions.className='event-actions';const edit=document.createElement('button');edit.type='button';edit.className='icon-action edit-action';edit.setAttribute('aria-label','일정 수정');edit.title='수정';edit.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>';edit.insertAdjacentHTML('beforeend','<span class="action-label">수정</span>');edit.onclick=()=>editEvent(i);const del=document.createElement('button');del.type='button';del.className='icon-action delete-action';del.setAttribute('aria-label','일정 삭제');del.title='삭제';del.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="m19 6-1 14H6L5 6"></path><path d="M10 11v5M14 11v5"></path></svg>';del.insertAdjacentHTML('beforeend','<span class="action-label">삭제</span>');del.onclick=()=>{events.splice(i,1);persist()};actions.append(edit,del);card.append(actions);card.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input')||card.querySelector('.event-edit'))return;swipeState={card,startX:e.clientX,startY:e.clientY,pointerId:e.pointerId,openAction:card.classList.contains('show-edit')?'edit':card.classList.contains('show-delete')?'delete':null};try{card.setPointerCapture(e.pointerId)}catch(err){}});card.addEventListener('pointermove',e=>{const state=swipeState;if(!state||state.card!==card||state.pointerId!==e.pointerId)return;const dx=e.clientX-state.startX,dy=e.clientY-state.startY;if(Math.abs(dx)>22&&Math.abs(dx)>Math.abs(dy)*1.1){if(state.openAction==='edit'){if(dx<0)card.classList.remove('show-edit')}else if(state.openAction==='delete'){if(dx>0)card.classList.remove('show-delete')}else{card.classList.remove('show-edit','show-delete');card.classList.add(dx<0?'show-delete':'show-edit')}}});content.addEventListener('click',()=>card.classList.remove('show-edit','show-delete'));eventsEl.append(card)})}
function parseDate(text){const now=new Date();let d=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(/글피/.test(text))d.setDate(d.getDate()+3);else if(/모레/.test(text))d.setDate(d.getDate()+2);else if(/내일/.test(text))d.setDate(d.getDate()+1);else if(/오늘/.test(text)){}else{const m=text.match(/(\d{1,2})월\s*(\d{1,2})일/);if(m){d=new Date(now.getFullYear(),Number(m[1])-1,Number(m[2]));if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate()))d.setFullYear(d.getFullYear()+1)}else{const days={'일요일':0,'월요일':1,'화요일':2,'수요일':3,'목요일':4,'금요일':5,'토요일':6,'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};const match=text.match(/(일요일|월요일|화요일|수요일|목요일|금요일|토요일|일|월|화|수|목|금|토)(?:요일)?/);if(match){let diff=(days[match[1]]-now.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff)}else return ''}}return dateISO(d)}
function parseTime(text){let m=text.match(/오전\s*(\d{1,2})(?:시\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1])%12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}m=text.match(/오후\s*(\d{1,2})(?:시\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1])%12+12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}m=text.match(/(\d{1,2}):(\d{2})/);if(m)return `${String(Number(m[1])).padStart(2,'0')}:${m[2]}`;m=text.match(/(\d{1,2})시(?:\s*(\d{1,2})분?)?/);if(m){let h=Number(m[1]);if(/오후|저녁/.test(text)&&h<12)h+=12;else if(!/오전|아침|새벽/.test(text)&&h>=1&&h<=6)h+=12;return `${String(h).padStart(2,'0')}:${String(Number(m[2]||0)).padStart(2,'0')}`}return ''}
function parseAndAdd(){if(isListening){pendingScheduleAdd=true;statusEl.textContent='음성 인식을 마친 뒤 일정을 추가할게요.';stopRecognition();return}const raw=textEl.value.trim();if(!raw){statusEl.textContent='먼저 음성으로 말하거나 일정을 입력해 주세요.';return}const segments=raw.split(/[,，;；]+|그리고\s+/).map(x=>x.trim()).filter(Boolean);const baseDate=parseDate(raw)||nextDayISO();segments.forEach(seg=>{const d=parseDate(seg)||baseDate,t=parseTime(seg)||'09:00';let title=seg.replace(/(오늘|내일|모레|글피|일요일|월요일|화요일|수요일|목요일|금요일|토요일)/g,'').replace(/오전\s*\d{1,2}\s*시?(?:\s*\d{1,2}\s*분?)?/g,'').replace(/오후\s*\d{1,2}\s*시?(?:\s*\d{1,2}\s*분?)?/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/\d{1,2}\s*시(?:\s*\d{1,2}\s*분?)?/g,'').replace(/\d{1,2}월\s*\d{1,2}일/g,'').replace(/^\s*(에|은|는|그리고)\s*/,'').split('\n').map(line=>line.trim().replace(/[ \t]+/g,' ')).join('\n').trim();events.push({title:title||'내용없음',date:d,time:t,important:document.getElementById('importantCheck').checked,id:Date.now()+Math.random()})});persist();textEl.value='';document.getElementById('importantCheck').checked=false;statusEl.textContent=`${segments.length}개 일정을 목록에 추가했어요. 날짜와 시간을 확인해 주세요.`}
function editEvent(i){const ev=events[i];if(!ev)return;if(editingEventId&&editingEventId!==ev.id)render();editingEventId=ev.id;const rowIndex=events.indexOf(ev),card=eventsEl.children[rowIndex],form=document.createElement('div'),nextDay=new Date();nextDay.setDate(nextDay.getDate()+1);form.className='event-edit';function addField(labelText,type,value){const label=document.createElement('label'),input=document.createElement('input');label.textContent=labelText;input.type=type;input.value=value||'';if(type==='date'||type==='time')input.addEventListener('click',()=>{if(typeof input.showPicker==='function'){try{input.showPicker()}catch(e){}}});label.append(input);form.append(label);return input}const titleInput=addField('일정 내용','text',ev.title),dateInput=addField('날짜','date',ev.date||dateISO(nextDay)),timeInput=addField('시간','time',ev.time||'09:00'),actions=document.createElement('div'),save=document.createElement('button'),cancel=document.createElement('button');actions.className='edit-actions';save.className='primary';save.type='button';save.textContent='저장';save.addEventListener('click',()=>{ev.title=titleInput.value.trim();ev.date=dateInput.value;ev.time=timeInput.value;editingEventId=null;persist()});cancel.className='secondary';cancel.type='button';cancel.textContent='취소';cancel.addEventListener('click',()=>{editingEventId=null;render()});actions.append(save,cancel);form.append(actions);card.replaceChildren(form);titleInput.focus()}
document.getElementById('parseBtn').onclick=parseAndAdd;const startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn');function setVoiceListening(listening){isListening=listening;if(listening){startBtn.innerHTML='<span class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>';startBtn.setAttribute('aria-label','음성 인식 중');startBtn.title='음성 인식 중';startBtn.setAttribute('aria-pressed','true');startBtn.disabled=true;stopBtn.disabled=false}else{startBtn.innerHTML='<svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg>';startBtn.setAttribute('aria-label','음성 입력 시작');startBtn.title='음성 입력 시작';startBtn.setAttribute('aria-pressed','false');startBtn.disabled=false;stopBtn.disabled=true}}startBtn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.textContent='이 브라우저에서는 음성 인식을 사용할 수 없어요. 다른 지원 브라우저에서 시도하거나 직접 입력해 주세요.';return}try{recognition=new SR();recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=true;let finalText='';recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=part+' ';else interim+=part}textEl.value=(finalText+interim).trim();statusEl.textContent='음성을 인식하고 있어요. 인식된 문장을 확인해 주세요.'};recognition.onerror=e=>{statusEl.textContent='음성 인식 오류: '+e.error+'. 브라우저 권한과 연결 상태를 확인해 주세요.';stopRecognition()};recognition.onend=()=>{setVoiceListening(false);if(pendingScheduleAdd){pendingScheduleAdd=false;parseAndAdd();return}if(!statusEl.textContent.includes('오류'))statusEl.textContent='음성 인식이 끝났어요. 문장을 확인한 뒤 일정을 추가해 주세요.'};recognition.start();setVoiceListening(true);statusEl.textContent='말씀해 주세요.'}catch(e){setVoiceListening(false);statusEl.textContent='음성 인식을 시작하지 못했어요. 브라우저 호환성이나 권한을 확인해 주세요.'}};function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){}}setVoiceListening(false)}stopBtn.onclick=stopRecognition;document.getElementById('clearBtn').onclick=()=>{if(confirm('저장된 일정을 모두 삭제할까요?')){events=[];persist()}};document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(events,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-schedule.json';a.click();URL.revokeObjectURL(url)};render();
</script></body></html>
