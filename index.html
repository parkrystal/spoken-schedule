const textEl=document.getElementById('speechText'),statusEl=document.getElementById('speechStatus'),eventsEl=document.getElementById('events'),pastEventsEl=document.getElementById('pastEvents'),currentToggle=document.getElementById('currentToggle'),pastToggle=document.getElementById('pastToggle'),currentCount=document.getElementById('currentCount'),pastCount=document.getElementById('pastCount');let events=loadEvents(),recognition=null,isListening=false,pendingScheduleAdd=false,pastOpen=false;currentToggle.addEventListener('click',()=>{pastOpen=false;render()});pastToggle.addEventListener('click',()=>{pastOpen=true;render()});let swipeState=null,editingEventId=null;document.addEventListener('pointerup',e=>{const state=swipeState;if(!state||state.pointerId!==e.pointerId)return;swipeState=null;const dx=e.clientX-state.startX,dy=e.clientY-state.startY;if(Math.abs(dx)>22&&Math.abs(dx)>Math.abs(dy)*1.1){if(state.openAction==='edit'){if(dx<0)state.card.classList.remove('show-edit')}else if(state.openAction==='delete'){if(dx>0)state.card.classList.remove('show-delete')}else{document.querySelectorAll('.event.show-edit,.event.show-delete').forEach(openCard=>{if(openCard!==state.card)openCard.classList.remove('show-edit','show-delete')});state.card.classList.remove('show-edit','show-delete');state.card.classList.add(dx<0?'show-delete':'show-edit')}}});document.addEventListener('pointercancel',e=>{if(swipeState&&swipeState.pointerId===e.pointerId)swipeState=null});
function loadEvents(){try{const saved=JSON.parse(localStorage.getItem('spokenScheduleEvents')||'[]');if(!Array.isArray(saved))return [];const fallbackDate=nextDayISO();let changed=false;const normalized=saved.map(ev=>{const item={...ev};if(!item.date){item.date=fallbackDate;changed=true}if(!item.time){item.time='09:00';changed=true}return item});if(changed)localStorage.setItem('spokenScheduleEvents',JSON.stringify(normalized));return normalized}catch(e){return []}}function persist(){localStorage.setItem('spokenScheduleEvents',JSON.stringify(events));render()}function dateISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function nextDayISO(){const d=new Date();d.setDate(d.getDate()+1);return dateISO(d)}function dateLabel(s){if(!s)return '날짜 미지정';const d=new Date(s+'T12:00:00');return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function render(){eventsEl.innerHTML='';pastEventsEl.innerHTML='';events.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99:99').localeCompare(b.time||'99:99'));const today=dateISO(new Date()),current=events.filter(ev=>!ev.date||ev.date>=today),past=events.filter(ev=>ev.date&&ev.date<today);currentCount.textContent=String(current.length);pastCount.textContent=String(past.length);eventsEl.hidden=pastOpen;pastEventsEl.hidden=!pastOpen;currentToggle.setAttribute('aria-selected',String(!pastOpen));pastToggle.setAttribute('aria-selected',String(pastOpen));if(!current.length)eventsEl.innerHTML='<div class="empty">'+(events.length?'오늘 이후의 일정이 없어요.':'아직 등록된 일정이 없어요.')+'</div>';if(!past.length)pastEventsEl.innerHTML='<div class="empty">지난 일정이 없어요.</div>';events.forEach((ev,i)=>{const isPast=Boolean(ev.date&&ev.date<today),targetList=isPast?pastEventsEl:eventsEl;const card=document.createElement('div');card.dataset.eventIndex=String(i);card.className='event'+(ev.important?' event-important':'');const top=document.createElement('div');top.className='eventtop';const info=document.createElement('div');const title=document.createElement('div');title.className='eventtitle';const icon=document.createElement('span');icon.className='day-icon';icon.setAttribute('aria-hidden','true');const hour=Number((ev.time||'09:00').split(':')[0]);icon.textContent=(hour>=4&&hour<18)?'☀️':'🌙';title.append(icon,document.createTextNode(ev.title||'내용없음'));const date=document.createElement('div');date.className='eventdate';date.textContent=dateLabel(ev.date)+(ev.time?' · '+ev.time:' · 시간 미지정');info.append(title,date);top.append(info);const content=document.createElement('div');content.className='event-content';content.append(top);card.append(content);const actions=document.createElement('div');actions.className='event-actions';const edit=document.createElement('button');edit.type='button';edit.className='icon-action edit-action';edit.setAttribute('aria-label','일정 수정');edit.title='수 const DATE_TOKEN_PATTERN=/(?:내년|다음\s*해|올해|작년|지난\s*해)(?:\s*\d{1,2}월\s*\d{1,2}일)?|\d{4}\s*년\s*\d{1,2}월\s*\d{1,2}일|\d{4}[-./]\s*\d{1,2}[-./]\s*\d{1,2}|\d{1,2}월\s*\d{1,2}일|글피|모레|내일|오늘|일요일|월요일|화요일|수요일|목요일|금요일|토요일|(?:^|\s)(?:일|월|화|수|목|금|토)(?:요일)?(?=\s|$)/;
function firstDateToken(text){const match=DATE_TOKEN_PATTERN.exec(text);return match?{value:match[0].trim(),index:match.index,length:match[0].length}:null}
function removeFirstDateToken(text){const match=firstDateToken(text);return match?text.slice(0,match.index)+text.slice(match.index+match.length):text}

function parseAndAdd(){if(isListening){pendingScheduleAdd=true;statusEl.textContent='음성 인식을 마친 뒤 일정을 추가할게요.';stopRecognition();return}const raw=textEl.value.trim();if(!raw){statusEl.textContent='먼저 음성으로 말하거나 일정을 입력해 주세요.';return}const segments=raw.split(/[,，;；]+|그리고\s+/).map(x=>x.trim()).filter(Boolean);const baseDate=parseDate(raw)||nextDayISO();segments.forEach(seg=>{const d=parseDate(seg)||baseDate,t=parseTime(seg)||'09:00';let title=removeFirstDateToken(seg).replace(/오전\s*\d{1,2}\s*시?(?:\s*\d{1,2}\s*분?)?/g,'').replace(/오후\s*\d{1,2}\s*시?(?:\s*\d{1,2}\s*분?)?/g,'').replace(/\d{1,2}:\d{2}/g,'').replace(/\d{1,2}\s*시(?:\s*\d{1,2}\s*분?)?/g,'').replace(/^\s*(에|은|는|그리고|과|와)\s*/,'').split('\n').map(line=>line.trim().replace(/[ \t]+/g,' ')).join('\n').trim();events.push({title:title||'내용없음',date:d,time:t,important:document.getElementById('importantCheck').checked,id:Date.now()+Math.random()})});persist();textEl.value='';document.getElementById('importantCheck').checked=false;statusEl.textContent=`${segments.length}개 일정을 목록에 추가했어요. 날짜와 시간을 확인해 주세요.`}

document.getElementById('parseBtn').onclick=parseAndAdd;const startBtn=document.getElementById('startBtn'),stopBtn=document.getElementById('stopBtn');function setVoiceListening(listening){isListening=listening;if(listening){startBtn.innerHTML='<span class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>';startBtn.setAttribute('aria-label','음성 인식 중');startBtn.title='음성 인식 중';startBtn.setAttribute('aria-pressed','true');startBtn.disabled=true;stopBtn.disabled=false}else{startBtn.innerHTML='<svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"></path></svg>';startBtn.setAttribute('aria-label','음성 입력 시작');startBtn.title='음성 입력 시작';startBtn.setAttribute('aria-pressed','false');startBtn.disabled=false;stopBtn.disabled=true}}let voiceSessionId=0;startBtn.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.textContent='이 브라우저에서는 음성 인식을 사용할 수 없어요. 다른 지원 브라우저에서 시도하거나 직접 입력해 주세요.';return}try{const session=new SR(),sessionId=++voiceSessionId;recognition=session;session.lang='ko-KR';session.continuous=true;session.interimResults=true;let finalText=textEl.value;if(finalText&&!/\s$/.test(finalText))finalText+=' ';session.onresult=e=>{if(recognition!==session||sessionId!==voiceSessionId)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const part=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=part+' ';else interim+=part}textEl.value=(finalText+interim).trim();statusEl.textContent='음성을 인식하고 있어요. 인식된 문장을 확인해 주세요.'};session.onerror=e=>{if(recognition!==session||sessionId!==voiceSessionId)return;if(e.error==='no-speech'||e.error==='aborted')return;statusEl.textContent='음성 인식 오류: '+e.error+'. 브라우저 권한과 연결 상태를 확인해 주세요.';stopRecognition()};session.onend
